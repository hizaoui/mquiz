  const blank = (keep = {}) => ({
    id: null, mousalsal: keep.mousalsal || "", question: lsGet(SCR.qKey, SCR_DEFAULT_Q) || SCR_DEFAULT_Q,
    mode: "qcm", choices: ["", "", "", ""], correct: -1, answer: "", image: "", file: null, preview: "", resolved: 0, user: ""
  });
  let F = blank(), busy = false, objUrl = "";
  const fromDoc = q => {
    const has = Array.isArray(q.choices) && q.choices.length > 0;
    const ch = has ? q.choices.slice(0, 4).map(String) : ["", "", "", ""];
    while (ch.length < 4) ch.push("");
    return { id: q.id, mousalsal: q.mousalsal || "", question: q.question || "", mode: has ? "qcm" : "kb", choices: ch,
      correct: has ? ch.findIndex(c => c.trim() === String(q.correctAnswer ?? "").trim() && c.trim()) : -1,
      answer: q.answer || "", image: q.image || "", file: null, preview: "", resolved: Number.isInteger(q.resolved) ? q.resolved : 0, user: q.user || "",
      loadNote: has && q.choices.length !== 4 ? `السؤال هذا فيه ${q.choices.length} اختيارات. الفورم يخدم بـ4: ثبّت قبل ما تحفظ.` : "" };
  };
  if (editQ) F = fromDoc(editQ);

  v.innerHTML = `<div class="head"><div><h2>أسئلة السكراتش</h2><p>الصورة مغطّاة واللاعب يحكّ باش يعرف الشخصية. كل ما يحكّ أقل، ياخذ نجوم أكثر.</p></div></div>
    <div class="note">كل إضافة ولا تعديل ولا حذف هنا <b>ينشر مباشرة</b> (يزيد نسخة الكتالوج). تأكد إلّي نسخة اللعبة عند اللاعبين تعرف النوع <span class="ltr">"scratch"</span>.</div>
    <div class="scr-grid">
      <div class="panel scr-form" id="sForm"></div>
      <div class="scr-side">
        <div class="scr-phone"><div class="q" id="pQ"></div><div class="scr-stage" id="pStage"></div>
          <div class="scr-meter"><span id="pPct">محكوك: 0%</span><span class="stars" id="pStars">★ 100</span></div><div class="scr-bar"><i id="pBar"></i></div>
          <div id="pAns"></div>
          <div class="scr-tools"><span class="small" style="color:#AEB7C2">اسحب بالصبع ولا الفأرة على الصورة</span><button type="button" class="btn sm" id="pReset">عاود غطّي</button></div></div>
        <div id="sTray"></div>
      </div>
    </div>
    <div class="scr-list-h"><div class="section-t">الأسئلة الموجودة</div><span class="tag scr" id="lCount">…</span><span class="grow"></span><button class="btn sm" id="lReload">تحديث</button></div>
    <div class="panel"><div class="tbl-wrap" id="lTable"></div><div class="scr-more" id="lMore"></div></div>`;

  const sim = scratchSim($("#pStage"), pct => {
    $("#pPct").textContent = `محكوك: ${pct}%`; $("#pStars").textContent = `★ ${scrStars(pct)} (تقريبي)`; $("#pBar").style.width = pct + "%";
  });
  const imgSrc = () => F.preview || F.image;
  const drawPreview = () => {
    $("#pQ").textContent = F.question.trim() || "…";
    const src = imgSrc(), stage = $("#pStage");
    if (stage.dataset.src !== src) {
      stage.dataset.src = src;
      stage.innerHTML = src ? `<img alt="" draggable="false">` : `<div class="ph">الصورة تظهر هنا مغطّاة، وتنجم تجرّب تحكّها.</div>`;
      if (src) { const im = $("img", stage); im.onload = () => { sim.mount(); drawImgInfo(im); }; im.onerror = () => { sim.remove(); drawImgInfo(null, true); }; im.src = src; }
      else { sim.remove(); drawImgInfo(null); }
    }
    $("#pAns").innerHTML = F.mode === "qcm"
      ? `<div class="scr-ch">${F.choices.map((c, i) => `<span class="${i === F.correct && c.trim() ? "ok" : ""}">${esc(c.trim() || "…")}</span>`).join("")}</div>`
      : `<div class="scr-kb" aria-label="حروف الكيبورد">${[...F.answer.trim().replace(/\s+/g, "")].map(ch => `<span>${esc(ch)}</span>`).join("") || `<span>…</span>`}</div>`;
  };
  const drawImgInfo = (im, failed) => {
    const box = $("#sImgInfo"); if (!box) return;
    if (failed) { box.innerHTML = `<div class="scr-warn">الصورة ما تحمّلتش. ثبّت الرابط.</div>`; return; }
    if (!im) { box.innerHTML = ""; return; }
    const w = im.naturalWidth, h = im.naturalHeight, warn = [];
    if (Math.max(w, h) < 500) warn.push("الصورة صغيرة: تولّي مضبّبة على التلفون. المنصوح بيه حوالي 800px.");
    if (w / h > 1.6 || h / w > 1.6) warn.push("الصورة طويلة برشا: الشخصية لازم تكون في الوسط باش ما تتقصّش.");
    if (F.file && Math.max(w, h) > 800 && !lsGet(SCR.resizeKey, true)) warn.push("أكبر من 800px: اللاعبين يحمّلو أكثر من اللازم.");
    box.innerHTML = `<span class="small muted"><span dir="ltr">${w}×${h}px</span>${F.file ? ` · ${(F.file.size / 1024).toFixed(0)} KB (قبل التصغير)` : ""}</span>${warn.map(x => `<div class="scr-warn">${esc(x)}</div>`).join("")}`;
  };
  const seriesBtnHTML = () => {
    const s = S.series.find(x => x.id === F.mousalsal);
    return `${s?.image ? `<img class="sp-cover" src="${esc(s.image)}" alt="">` : `<span class="sp-cover">🎬</span>`}<span class="nm">${s ? esc(s.name) : `<span class="muted">اختار مسلسل…</span>`}</span><span aria-hidden="true">▾</span>`;
  };

  const drawForm = () => {
    const f = $("#sForm");
    f.innerHTML = `${F.id ? `<div class="scr-editing">✎ تعديل سؤال موجود<span class="grow"></span><button type="button" class="btn sm" id="sCancelEdit">إلغاء التعديل</button></div>` : ""}
      ${F.loadNote ? `<div class="scr-warn" style="margin:0 0 10px">${esc(F.loadNote)}</div>` : ""}
      <label class="f">المسلسل</label>
      <div class="sp" id="sp"><button type="button" class="sp-btn" id="spBtn" aria-haspopup="listbox" aria-expanded="false">${seriesBtnHTML()}</button>
        <div class="sp-pop hidden" id="spPop"><input type="search" id="spQ" placeholder="ابحث على مسلسل…"><div class="sp-list" role="listbox" id="spList"></div></div></div>
      <label class="f" for="sQ">السؤال</label><input type="text" id="sQ" value="${esc(F.question)}">
      <label class="f">طريقة الإجابة</label>
      <div class="seg" id="sMode"><button type="button" data-m="qcm">اختيارات (منصوح بيه)</button><button type="button" data-m="kb">كيبورد</button></div>
      <div id="sQcm" class="${F.mode === "qcm" ? "" : "hidden"}"><label class="f">4 اختيارات (اختار الصحيحة بالدائرة)</label><div class="scr-choices" id="sChoices"></div>
        <div class="small muted" style="margin-top:6px">التصحيح يفرّق بين الحروف الكبيرة والصغيرة: الإجابة الصحيحة تتسجّل كيما هي بالضبط.</div></div>
      <div id="sKb" class="${F.mode === "kb" ? "" : "hidden"}"><label class="f" for="sA">الإجابة</label><input type="text" id="sA" value="${esc(F.answer)}">
        <div class="small muted" style="margin-top:6px">اللعبة تبني الكيبورد من حروف الإجابة هذي.</div></div>
      <label class="f">صورة الشخصية</label>
      <label class="scr-drop" id="sDrop"><span><b>اسحب الصورة هنا</b> ولا انقر باش تختار</span><span class="small">واضحة، الشخصية في الوسط، حوالي 800px · Ctrl+V يخدم زادة</span>
        <input type="file" accept="image/*" id="sFile" hidden></label>
      <div class="scr-img-row">${imgSrc() ? `<img src="${esc(imgSrc())}" alt="">` : ""}<div class="scr-img-info" id="sImgInfo"></div></div>
      <div class="img-tools"><button type="button" class="btn sm" id="sLib">من المكتبة</button>${imgSrc() ? `<button type="button" class="btn sm danger" id="sNoImg">نحّي الصورة</button>` : ""}
        <label class="chk"><input type="checkbox" id="sResize" ${lsGet(SCR.resizeKey, true) ? "checked" : ""}> صغّر لـ 800px (JPEG) قبل الرفع</label></div>
      <div id="sErr"></div>
      <div class="scr-actions"><button class="btn primary" id="sSave">${F.id ? "حفظ ونشر" : "إضافة ونشر"}</button><button type="button" class="btn" id="sClear">تفريغ</button>
        <span class="grow"></span><span class="small muted">بعد الإضافة، المسلسل يبقى مختار.</span></div>`;
    $$("#sMode button", f).forEach(b => { b.classList.toggle("on", b.dataset.m === F.mode); b.onclick = () => { F.mode = b.dataset.m; if (F.mode === "kb" && !F.answer.trim() && F.correct >= 0) F.answer = F.choices[F.correct].trim(); drawForm(); drawPreview(); }; });
    $("#sQ", f).oninput = e => { F.question = e.target.value; drawPreview(); };
    $("#sA", f).oninput = e => { F.answer = e.target.value; drawPreview(); };
    drawChoices();
    // series picker
    const pop = $("#spPop", f), btn = $("#spBtn", f);
    const drawOpts = () => {
      const qq = norm($("#spQ", f).value);
      const list = S.series.filter(s => !qq || norm(s.name).includes(qq));
      $("#spList", f).innerHTML = list.map(s => `<button type="button" class="sp-opt" role="option" aria-selected="${s.id === F.mousalsal}" data-id="${esc(s.id)}">${s.image ? `<img class="sp-cover" src="${esc(s.image)}" alt="" loading="lazy">` : `<span class="sp-cover">🎬</span>`}<span>${esc(s.name)}</span></button>`).join("") || `<div class="tray-empty">ما فماش.</div>`;
      $$(".sp-opt", f).forEach(o => o.onclick = () => { F.mousalsal = o.dataset.id; closePop(); btn.innerHTML = seriesBtnHTML(); tray.refresh(); });
    };
    const closePop = () => { pop.classList.add("hidden"); btn.setAttribute("aria-expanded", "false"); document.removeEventListener("pointerdown", outside, true); };
    const outside = e => { if (!e.target.closest("#sp")) closePop(); };
    btn.onclick = () => {
      if (!pop.classList.contains("hidden")) return closePop();
      pop.classList.remove("hidden"); btn.setAttribute("aria-expanded", "true"); $("#spQ", f).value = ""; drawOpts(); $("#spQ", f).focus();
      document.addEventListener("pointerdown", outside, true);
    };
    $("#spQ", f).oninput = drawOpts;
    pop.onkeydown = e => { if (e.key === "Escape") { closePop(); btn.focus(); } };
    // image
    const takeFiles = files => { const file = files.find(x => x.type.startsWith("image/")); if (!file) return toast("الملف موش صورة.", "bad"); setFile(file); };
    $("#sFile", f).onchange = e => { const files = [...e.target.files]; e.target.value = ""; if (files.length) takeFiles(files); };
    dropZone($("#sDrop", f), { onImage: setUrl, onFiles: takeFiles });
    $("#sLib", f).onclick = async () => { const u = await openMediaPicker(); if (u) setUrl(u); };
    $("#sNoImg", f)?.addEventListener("click", () => setUrl(""));
    $("#sResize", f).onchange = e => lsSet(SCR.resizeKey, e.target.checked);
    $("#sSave", f).onclick = save;
    $("#sClear", f).onclick = () => { F = blank({ mousalsal: F.mousalsal }); resetImgState(); drawForm(); drawPreview(); };
    $("#sCancelEdit", f)?.addEventListener("click", () => { F = blank({ mousalsal: F.mousalsal }); resetImgState(); drawForm(); drawPreview(); });
    const im = $("#pStage img"); if (im?.complete && im.naturalWidth) drawImgInfo(im);
  };
  const drawChoices = () => {
    const box = $("#sChoices"); if (!box) return;
    box.innerHTML = F.choices.map((c, i) => `<div class="scr-choice ${i === F.correct ? "ok" : ""}">
      <input type="radio" name="sCorr" data-i="${i}" ${i === F.correct ? "checked" : ""} aria-label="الإجابة الصحيحة">
      <input type="text" data-i="${i}" value="${esc(c)}" placeholder="اختيار ${i + 1}"></div>`).join("");
    $$("input[type=radio]", box).forEach(r => r.onchange = () => { F.correct = +r.dataset.i; drawChoices(); drawPreview(); });
    $$("input[type=text]", box).forEach(inp => {
      inp.oninput = () => { F.choices[+inp.dataset.i] = inp.value; drawPreview(); };
      inp.onblur = () => { const t = inp.value.trim(); if (t !== inp.value) { inp.value = t; F.choices[+inp.dataset.i] = t; drawPreview(); } };
      dropZone(inp, { onName: t => putChoice(+inp.dataset.i, t) });
    });
  };
  const putChoice = (i, t) => {
    t = String(t).trim();
    if (F.choices.some((c, j) => j !== i && c.trim() === t)) return toast("الاختيار هذا موجود.", "bad");
    F.choices[i] = t; drawChoices(); drawPreview(); pulse($$("#sChoices .scr-choice")[i]);
  };
  const placeName = t => {
    if (F.mode === "kb") { F.answer = String(t).trim(); $("#sA").value = F.answer; pulse($("#sA")); drawPreview(); return; }
    const i = F.choices.findIndex(c => !c.trim());
    if (i < 0) return toast("الـ4 اختيارات معمّرين. اسحب الاسم على اختيار باش تبدّلو.", "bad");
    putChoice(i, t);
  };
  const resetImgState = () => { if (objUrl) URL.revokeObjectURL(objUrl); objUrl = ""; };
  const setFile = file => { resetImgState(); objUrl = URL.createObjectURL(file); F.file = file; F.preview = objUrl; F.image = ""; drawForm(); drawPreview(); pulse($("#pStage")); };
  const setUrl = url => { resetImgState(); F.file = null; F.preview = ""; F.image = String(url || "").trim(); if (F.image) rememberImage(F.image); drawForm(); drawPreview(); if (F.image) pulse($("#pStage")); };
  v.onpaste = e => {
    if (e.target.closest("input[type=text],input[type=search],textarea") && ![...(e.clipboardData?.files || [])].length) return;
    const files = [...(e.clipboardData?.files || [])].filter(x => x.type.startsWith("image/"));
    if (files.length) { e.preventDefault(); setFile(files[0]); }
  };

  const save = async () => {
    if (busy) return;
    const { errors, warns, data } = buildScratch({ ...F, image: F.image || (F.file ? "pending-upload" : "") });
    $("#sErr").innerHTML = errors.length ? `<div class="form-errors"><ul>${errors.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
    if (errors.length) return;
    if (warns.length && !await confirmBox(warns.join("\n") + "\nتحفظ هكّا؟", "نحفظ", false)) return;
    if (!await confirmPublishSideEffect(F.id ? "الحفظ" : "الإضافة")) return;
    busy = true; const btn = $("#sSave"); btn.disabled = true; $("#sClear").disabled = true;
    try {
      if (F.file) {
        btn.textContent = "جاري رفع الصورة…";
        const ready = await prepScratchImage(F.file, lsGet(SCR.resizeKey, true));
        data.image = await uploadFile(ready, SCR.prefix);
        F.image = data.image; F.file = null; F.preview = ""; resetImgState(); // a retry won't upload twice
      }
      btn.textContent = "جاري الحفظ والنشر…";
      const ref_ = F.id ? doc(db, "questions", F.id) : doc(collection(db, "questions"));
      const nv = await scratchCommit(tx => tx.set(ref_, data)); // full replace: keyboard mode drops choices/correctAnswer
      const saved = normalizeQuestion(ref_.id, data);
      if (S.questions) { const i = S.questions.findIndex(x => x.id === ref_.id); if (i >= 0) S.questions[i] = saved; else S.questions.unshift(saved); }
      if (L.items) { const i = L.items.findIndex(x => x.id === ref_.id); if (i >= 0) L.items[i] = saved; else { L.items.unshift(saved); if (L.total != null) L.total++; } }
      lsSet(SCR.qKey, data.question);
      toast(`${F.id ? "تم الحفظ" : "تمت الإضافة"} والنشر · النسخة ${nv}`, "good");
      F = blank({ mousalsal: data.mousalsal }); // bulk add: keep the series, clear the rest
      drawForm(); drawPreview(); drawList();
      $("#sChoices input[type=text]")?.focus();
    } catch (e) {
      toast(errMsg(e), "bad");
      btn.disabled = false; $("#sClear").disabled = false; btn.textContent = F.id ? "حفظ ونشر" : "إضافة ونشر";
      if (F.image) drawForm();
    } finally { busy = false; renderPubBar(); }
  };

  // ----- list: paged one-time reads, never the whole collection -----
  const base = () => query(collection(db, "questions"), where("type", "==", "scratch"));
  const loadPage = async () => {
    const qy = L.last ? query(collection(db, "questions"), where("type", "==", "scratch"), startAfter(L.last), limit(SCR.page))
      : query(collection(db, "questions"), where("type", "==", "scratch"), limit(SCR.page));
    const snap = await getDocs(qy);
    L.items = [...(L.items || []), ...snap.docs.map(d => normalizeQuestion(d.id, d.data()))];
    L.last = snap.docs[snap.docs.length - 1] || L.last; L.done = snap.docs.length < SCR.page;
  };
  const loadCount = async () => { try { L.total = (await getCountFromServer(base())).data().count; } catch { L.total = null; } drawCount(); };
  const drawCount = () => { $("#lCount").textContent = L.total == null ? `${L.items?.length || 0}` : `${L.total} سؤال`; };
  const drawList = () => {
    drawCount();
    const items = L.items || [];
    $("#lTable").innerHTML = items.length ? `<table class="resp"><thead><tr><th>صورة</th><th>السؤال</th><th>المسلسل</th><th>الطريقة</th><th>الإجابة</th><th></th></tr></thead><tbody>
      ${items.map(q => { const iss = issuesOf(q); return `<tr data-id="${esc(q.id)}"><td class="img">${thumbHTML(q.image)}</td><td class="q">${esc(q.question)}${iss.length ? `<div>${iss.map(i => `<span class="tag bad">${esc(i)}</span>`).join(" ")}</div>` : ""}</td>
        <td class="small" data-label="المسلسل">${esc(seriesName(q.mousalsal))}</td><td data-label="الطريقة">${q.choices.length ? `<span class="tag qcm">اختيارات</span>` : `<span class="tag">كيبورد</span>`}</td>
        <td class="small" data-label="الإجابة"><b>${esc(q.choices.length ? (q.correctAnswer || "—") : (q.answer || "—"))}</b></td>
        <td class="actions"><button class="btn sm" data-edit>تعديل</button> <button class="btn sm danger" data-del>حذف</button></td></tr>`; }).join("")}</tbody></table>`
      : `<div class="empty-state">ما فماش أسئلة سكراتش بعد. زيد أول وحدة الفوق.</div>`;
    $("#lMore").innerHTML = items.length && !L.done ? `<button class="btn" id="lMoreBtn">حمّل ${SCR.page} أخرين</button>` : items.length ? `<span class="small muted">هذا الكل.</span>` : "";
    $("#lMoreBtn")?.addEventListener("click", async e => { e.target.disabled = true; e.target.textContent = "جاري التحميل…"; try { await loadPage(); } catch (err) { toast(errMsg(err), "bad"); } drawList(); });
    $$("#lTable tr[data-id]").forEach(tr => {
      const q = items.find(x => x.id === tr.dataset.id);
      tr.querySelector("[data-edit]").onclick = () => { resetImgState(); F = fromDoc(q); drawForm(); drawPreview(); $("#sForm").scrollIntoView({ behavior: "smooth", block: "start" }); };
      tr.querySelector("[data-del]").onclick = async () => {
        if (!await deleteScratch(q)) return;
        L.items = L.items.filter(x => x.id !== q.id); if (L.total != null) L.total = Math.max(0, L.total - 1);
        if (F.id === q.id) { F = blank({ mousalsal: F.mousalsal }); drawForm(); drawPreview(); }
        drawList(); renderPubBar();
      };
    });
  };
  $("#lReload").onclick = async () => { L.items = null; L.last = null; L.done = false; $("#lTable").innerHTML = `<div class="loading">جاري التحميل…</div>`; try { await loadPage(); } catch (e) { toast(errMsg(e), "bad"); L.items = []; } drawList(); loadCount(); };
  $("#pReset").onclick = () => sim.reset();

  const tray = mountTray($("#sTray"), { getSeries: () => F.mousalsal, getUsed: () => [F.image], onImage: setUrl, onName: placeName });
  if (!S.chars) loadChars().then(() => tray.refresh()).catch(() => { S.chars = S.chars || []; });
  drawForm(); drawPreview();
  if (!L.items) { $("#lTable").innerHTML = `<div class="loading">جاري التحميل…</div>`; try { await loadPage(); } catch (e) { L.items = []; toast(errMsg(e), "bad"); } loadCount(); }
  else if (L.total == null) loadCount();
  drawList();
};

/* ================= auth gate ================= */
function renderAuth(state, user) {
  const c = $("#authCard");
  if (state === "signin") {
    c.innerHTML = `<h1>لوحة التحكم</h1><p>مسلسلات تونسية QUIZ. الدخول مخصص للمشرفين.</p>
      <button class="btn primary" id="gIn" style="width:100%;padding:10px">الدخول بحساب Google</button>`;
    $("#gIn").onclick = async () => { try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (e) { toast(errMsg(e), "bad"); } };
  } else if (state === "denied") {
    c.innerHTML = `<h1>ما عندكش صلاحية</h1>
      <p>الحساب <span class="ltr">${esc(user.email)}</span> ما عندوش الصلاحية <code>fireCMSUser</code>.</p>
      <p class="small">مالك المشروع يعطيها مرة وحدة من سيرفر فيه Admin SDK:</p>
      <pre>admin.auth().setCustomUserClaims(
  "${esc(user.uid)}", { fireCMSUser: true });</pre>
      <p class="small">بعدها اخرج وادخل من جديد.</p>
      <button class="btn" id="out">خروج</button>`;
    $("#out").onclick = () => signOut(auth);
  }
}
async function doSignOut() {
  if (pendingCount() && !await confirmBox(`فما ${pendingCount()} تغيير غير منشور. محفوظين، أما اللاعبين ما يشوفوهمش حتى تنشر. تخرج؟`, "خروج", false)) return;
  signOut(auth);
}
onAuthStateChanged(auth, async user => {
  if (!user) { unwatch.forEach(f => f()); unwatch = []; $("#app").classList.add("hidden"); $("#auth").classList.remove("hidden"); renderAuth("signin"); return; }
  try {
    const tok = await user.getIdTokenResult(); // claim is in the cached token; no forced refresh on every load
    if (tok.claims.fireCMSUser !== true) {
      const fresh = await user.getIdTokenResult(true); // only refresh if missing (claim may have just been granted)
      if (fresh.claims.fireCMSUser !== true) { renderAuth("denied", user); return; }
    }
  } catch (e) { toast(errMsg(e), "bad"); renderAuth("signin"); return; }
  $("#auth").classList.add("hidden"); $("#app").classList.remove("hidden");
  $("#who").innerHTML = `${user.photoURL ? `<img src="${esc(user.photoURL)}" alt="">` : ""}<span>${esc(user.displayName || user.email)}</span><br><button id="logout">خروج</button>`;
  $("#logout").onclick = doSignOut;
  $("#mOut").onclick = doSignOut;
  loadPendingCount();
  watchShared();
  route();
});
</script>
